name: "Test: Ota contract matrix"

on:
  workflow_dispatch:
    inputs:
      ota_repository:
        description: Ota source repository to build for this matrix run
        required: false
        default: bobaikato/ota
      ota_ref:
        description: Ota branch, tag, or commit to build for this matrix run
        required: false
        default: 1.6.20-implementation
  pull_request:
    paths:
      - "ota.yaml"
      - ".github/workflows/test-ota-contract-matrix.yml"
  push:
    paths:
      - "ota.yaml"
      - ".github/workflows/test-ota-contract-matrix.yml"

concurrency:
  group: ota-contract-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OTA_NO_UPDATE_CHECK: "1"

jobs:
  native:
    name: Ota Contract Matrix (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-full
            os: ubuntu-latest
            full_run: true
            app_proof: true
          - name: macos-full
            os: macos-latest
            full_run: true
            app_proof: false
          - name: windows-full
            os: windows-latest
            full_run: true
            app_proof: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install docker CLI (macOS)
        if: ${{ matrix.os == 'macos-latest' }}
        shell: bash
        run: brew install docker

      - name: Install ota from source
        uses: ota-run/ota/.github/actions/install-ota-from-source@v1.6.19
        with:
          repository: ${{ github.event.inputs.ota_repository || 'bobaikato/ota' }}
          ref: ${{ github.event.inputs.ota_ref || '1.6.20-implementation' }}

      - name: Assert ota minimum version from contract
        shell: bash
        run: |
          ota --version | tee ota-version.txt
          required="$(awk -F'"' '/minimum_version:/{print $2; exit}' ota.yaml)"
          if [ -z "$required" ]; then
            echo "missing metadata.ota.minimum_version in ota.yaml"
            exit 1
          fi
          node - "$required" "$(cat ota-version.txt)" <<'JS'
          const required = process.argv[2];
          const versionLine = process.argv[3];
          const match = versionLine.match(/v(\d+\.\d+\.\d+)/);
          if (!match) {
            console.error(`unable to parse ota version from: ${versionLine}`);
            process.exit(1);
          }
          const current = match[1];
          const toParts = (v) => v.split('.').map((x) => Number.parseInt(x, 10));
          const compare = (a, b) => {
            const ap = toParts(a);
            const bp = toParts(b);
            for (let i = 0; i < 3; i += 1) {
              const diff = (ap[i] || 0) - (bp[i] || 0);
              if (diff !== 0) return diff;
            }
            return 0;
          };
          if (compare(current, required) < 0) {
            console.error(`installed ota ${current} does not satisfy minimum_version ${required}`);
            process.exit(1);
          }
          JS

      - name: Validate contract
        shell: bash
        run: |
          ota validate --json . > ota-validate.json
          ota validate .

      - name: Doctor verify workflow
        shell: bash
        run: ota doctor --workflow verify .

      - name: List task surfaces
        shell: bash
        run: |
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --unsafe --use .

      - name: List workflows
        shell: bash
        run: ota workflows .

      - name: Export task graph
        shell: bash
        run: |
          ota tasks --workflow verify --json . > ota-tasks-verify.json
          cat ota-tasks-verify.json
          ota tasks --workflow app --json . > ota-tasks-app.json
          cat ota-tasks-app.json

      - name: Export execution topology
        shell: bash
        run: |
          ota execution topology --json . > ota-execution-topology.json
          cat ota-execution-topology.json

      - name: Dry-run verify workflow
        shell: bash
        run: |
          ota up --workflow verify --native --dry-run --json . > ota-up-verify.json
          node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('ota-up-verify.json', 'utf8'));
          if (!report.dry_run || report.status === 'BLOCKED') {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          JS

      - name: Dry-run verify task
        shell: bash
        run: |
          ota run verify --native --dry-run --json . > ota-run-verify.json
          node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('ota-run-verify.json', 'utf8'));
          if (!report.dry_run || report.status === 'BLOCKED') {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          JS

      - name: Dry-run app workflow
        shell: bash
        run: |
          ota up --workflow app --native --dry-run --json . > ota-up-app.json
          node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('ota-up-app.json', 'utf8'));
          if (!report.dry_run || report.status === 'BLOCKED') {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          JS

      - name: Execute verify task
        if: ${{ matrix.full_run }}
        timeout-minutes: 120
        shell: bash
        run: ota run verify --native --stream .

      - name: Execute verify workflow
        if: ${{ matrix.full_run }}
        timeout-minutes: 120
        shell: bash
        run: ota up --workflow verify --native --stream .

      - name: Proof app workflow runtime
        if: ${{ matrix.app_proof }}
        timeout-minutes: 150
        shell: bash
        run: ota proof runtime --workflow app --native --ready-timeout 30m .

      - name: Teardown app workflow
        if: ${{ matrix.app_proof }}
        timeout-minutes: 30
        shell: bash
        run: ota run dev:down --native --stream .

      - name: Assert app teardown is clean
        if: ${{ matrix.app_proof }}
        shell: bash
        run: |
          running="$(cd docker && docker compose -f ./docker-compose.dev.yml ps --services --status running)"
          if [ -n "$running" ]; then
            echo "expected no running dev-stack services after teardown"
            echo "$running"
            exit 1
          fi

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-${{ matrix.name }}
          path: |
            ota-validate.json
            ota-execution-topology.json
            ota-tasks-verify.json
            ota-tasks-app.json
            ota-up-verify.json
            ota-run-verify.json
            ota-up-app.json
            .ota/proof/app

  container:
    name: Ota Contract Matrix (ubuntu-container)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install ota from source
        uses: ota-run/ota/.github/actions/install-ota-from-source@v1.6.19
        with:
          repository: ${{ github.event.inputs.ota_repository || 'bobaikato/ota' }}
          ref: ${{ github.event.inputs.ota_ref || '1.6.20-implementation' }}

      - name: Assert ota minimum version from contract
        shell: bash
        run: |
          ota --version | tee ota-version.txt
          required="$(awk -F'"' '/minimum_version:/{print $2; exit}' ota.yaml)"
          if [ -z "$required" ]; then
            echo "missing metadata.ota.minimum_version in ota.yaml"
            exit 1
          fi
          node - "$required" "$(cat ota-version.txt)" <<'JS'
          const required = process.argv[2];
          const versionLine = process.argv[3];
          const match = versionLine.match(/v(\d+\.\d+\.\d+)/);
          if (!match) {
            console.error(`unable to parse ota version from: ${versionLine}`);
            process.exit(1);
          }
          const current = match[1];
          const toParts = (v) => v.split('.').map((x) => Number.parseInt(x, 10));
          const compare = (a, b) => {
            const ap = toParts(a);
            const bp = toParts(b);
            for (let i = 0; i < 3; i += 1) {
              const diff = (ap[i] || 0) - (bp[i] || 0);
              if (diff !== 0) return diff;
            }
            return 0;
          };
          if (compare(current, required) < 0) {
            console.error(`installed ota ${current} does not satisfy minimum_version ${required}`);
            process.exit(1);
          }
          JS

      - name: Validate contract
        shell: bash
        run: |
          ota validate --json . > ota-validate.json
          ota validate .

      - name: Doctor verify workflow (container)
        shell: bash
        run: ota doctor --mode container --workflow verify .

      - name: List task surfaces
        shell: bash
        run: |
          ota tasks --use .
          ota tasks --safe --use .
          ota tasks --unsafe --use .

      - name: List workflows
        shell: bash
        run: ota workflows .

      - name: Export task graph
        shell: bash
        run: |
          ota tasks --workflow verify --json . > ota-tasks-verify.json
          cat ota-tasks-verify.json

      - name: Export execution topology
        shell: bash
        run: |
          ota execution topology --json . > ota-execution-topology.json
          cat ota-execution-topology.json

      - name: Dry-run verify workflow (container)
        shell: bash
        run: |
          ota up --workflow verify --container --dry-run --json . > ota-up-verify-container.json
          node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('ota-up-verify-container.json', 'utf8'));
          if (!report.dry_run || report.status === 'BLOCKED') {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          JS

      - name: Dry-run verify task (container)
        shell: bash
        run: |
          ota run verify --container --dry-run --json . > ota-run-verify-container.json
          node - <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('ota-run-verify-container.json', 'utf8'));
          if (!report.dry_run || report.status === 'BLOCKED') {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          JS

      - name: Execute verify task (container)
        timeout-minutes: 120
        shell: bash
        run: ota run verify --container --stream .

      - name: Execute verify workflow (container)
        timeout-minutes: 120
        shell: bash
        run: ota up --workflow verify --container --stream .

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ota-contract-matrix-ubuntu-container
          path: |
            ota-validate.json
            ota-execution-topology.json
            ota-tasks-verify.json
            ota-up-verify-container.json
            ota-run-verify-container.json
