version: 1
project:
  name: immich-compose-runtime-digest-pressure
  description: Narrow Compose infrastructure proof for receipt-authored immutable runtime image identity
  type: application
agent:
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: branch
        branch: 1.6.24-implementation
  safe_tasks:
    - infra:status
tasks:
  infra:setup-env:
    description: Create the documented local Compose environment file without overwriting operator values
    action:
      kind: copy_if_missing
      from: docker/example.env
      to: docker/.env
    effects:
      writes:
        - docker/.env
  infra:status:
    description: Inspect the selected digest-pinned infrastructure services without mutation
    safe_for_agent: true
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          files:
            - docker-compose.yml
    compose:
      kind: ps
      services:
        - redis
        - database
    requirements:
      tools:
        docker: "*"
  infra:up:
    description: Start only the digest-pinned Redis and PostgreSQL infrastructure services
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          files:
            - docker-compose.yml
    compose:
      kind: up
      detach: true
      services:
        - redis
        - database
    requirements:
      tools:
        docker: "*"
    effects:
      writes:
        - docker/postgres
      network: true
      network_kind: container_image_hydration
  infra:stop:
    description: Stop the narrow infrastructure lane without deleting its persistent data
    adapter_inputs:
      overlays:
        compose:
          cwd: docker
          files:
            - docker-compose.yml
    compose:
      kind: stop
      services:
        - redis
        - database
    requirements:
      tools:
        docker: "*"
workflows:
  default: infrastructure
  infrastructure:
    intent: local_development
    description: Start the narrow local infrastructure lane without claiming the mutable Immich application images
    prepare:
      task: infra:setup-env
    run:
      task: infra:up
