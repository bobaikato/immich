version: 1
metadata:
  ota:
    minimum_version: "1.6.20"
project:
  name: immich
  description: Immich readiness contract covering the repo-native mise verification slice plus the canonical docker-backed local development stack through `mise dev`
  type: application
execution:
  default_context: host
  contexts:
    host:
      backend: native
    app:
      backend: container
      lifecycle: persistent
      env:
        MISE_CACHE_DIR: /workspace/.ota/mise/cache
        MISE_DATA_DIR: /workspace/.ota/mise/data
        MISE_STATE_DIR: /workspace/.ota/mise/state
      container:
        image: jdxcode/mise:latest
        engines:
          - docker
          - podman
      attachments:
        isolated_paths:
          - node_modules
          - .pnpm-store
toolchains:
  node:
    version: "24.15.0"
    package_managers:
      pnpm: "10.33.4"
    fulfillment:
      source: mise
      mode: run
orchestrators:
  mise:
    kind: mise
    required: true
    config_files:
      - mise.toml
    activation:
      trust: true
    prepare:
      install: true
surfaces:
  site:
    kind: http
    label: Immich Web
    purpose: Primary browser-facing Immich application surface
    visibility: public
    port: 3000
    path: /
    readiness:
      kind: http
      path: /
      success:
        status: [200]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
  api:
    kind: http
    label: Immich API
    purpose: Canonical Immich API surface exposed by the dev stack
    visibility: internal
    port: 2283
    path: /api
    readiness:
      kind: http
      path: /api/server/ping
      success:
        status: [200]
      body:
        contains: '"res":"pong"'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
  machine-learning:
    kind: http
    label: Immich Machine Learning
    purpose: Machine-learning inference surface used by the local dev stack
    visibility: internal
    port: 3003
    path: /
    readiness:
      kind: http
      path: /ping
      success:
        status: [200]
      body:
        contains: "pong"
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
  e2e-site:
    kind: http
    label: Immich E2E Web
    purpose: Browser-facing web surface for the repo's dedicated e2e dev stack
    visibility: internal
    port: 2285
    path: /
    readiness:
      kind: http
      path: /
      success:
        status: [200]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
  e2e-api:
    kind: http
    label: Immich E2E API
    purpose: API surface for the repo's dedicated e2e dev stack
    visibility: internal
    port: 2285
    path: /api
    readiness:
      kind: http
      path: /api/server/ping
      success:
        status: [200]
      body:
        contains: '"res":"pong"'
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s
tasks:
  setup:env:docker:
    context: host
    description: Materialize the docker dev env file when the repo has not created one yet
    category: setup
    action:
      kind: copy_if_missing
      from: docker/example.env
      to: docker/.env
    effects:
      writes:
        - docker/.env
    notes: |
      The repo's local dev stack expects `docker/.env`.
      The checked-in example already carries workable local defaults, so Ota should materialize it
      instead of pushing that burden back into README prose.
  setup:
    context: host
    description: Trust the repository mise config and install the declared tool set
    category: setup
    run: "true"
    execution:
      default_mode: native
      orchestrator:
        ref: mise
        mode: exec
      modes:
        native:
          context: host
        container:
          context: app
    requirements:
      toolchains:
        - node
    effects:
      network: true
      network_kind: dependency_hydration
    notes: |
      The repo's live contributor and CI task surface is driven through `mise.toml`.
      This contract keeps that truth directly through `orchestrators.mise` and
      `toolchains.node.fulfillment.source: mise` instead of flattening it into shell glue.
    internal: true
  setup:docker:images:
    context: host
    description: Pre-pull the registry-backed docker dependencies before runtime proof or startup
    category: setup
    prepare:
      kind: dependency_hydration
      medium: container_images
      source:
        kind: docker_compose
        cwd: docker
        file: docker-compose.dev.yml
      targets:
        - redis
        - database
    env:
      COMPOSE_BAKE: "true"
    depends_on:
      - setup:env:docker
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
      network: true
      network_kind: dependency_hydration
    notes: |
      The full local dev stack mixes external registry images with local build targets.
      Keeping external image hydration separate from `dev` lets Ota distinguish dependency fetch
      time from service readiness time during `ota up --workflow app` and
      `ota proof runtime --workflow app` without pretending the locally built app images should be
      pulled from a registry.
  setup:app:
    description: Prepare the canonical docker-backed local development path before service startup
    category: setup
    aggregate:
      tasks:
        - setup
        - setup:docker:images
    internal: true
  setup:e2e:
    description: Prepare the docker-backed e2e development path before service startup
    category: setup
    aggregate:
      tasks:
        - setup
        - setup:docker:images
    internal: true
  dev:
    context: host
    description: Start the canonical docker-backed local development stack through the repo's mise task surface
    category: dev
    launch:
      kind: command
      exe: mise
      args:
        - run
        - dev
    depends_on:
      - setup:env:docker
      - setup
      - setup:docker:images
    requirements:
      toolchains:
        - node
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
      network: true
      network_kind: broad
    runtime:
      kind: service
      surfaces:
        site:
          project:
            host:
              primary: true
        api: {}
        machine-learning: {}
    notes: |
      This is the repo's real contributor front door now that `make dev` delegates to `mise dev`.
      Ota models it as a long-running service launch through `mise run dev` so runtime proof and
      surfaced readiness stay first-class without flattening the repo's real task front door.
  dev:down:
    context: host
    description: Tear down the canonical local development stack through the repo's mise task surface
    category: cleanup
    run: //:dev-down
    execution:
      default_mode: native
      orchestrator:
        ref: mise
        mode: task
      modes:
        native:
          context: host
    depends_on:
      - setup:env:docker
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
    notes: |
      Use this when a prior dev run left compose state behind or when you want explicit teardown
      outside the `mise dev` interactive lifecycle.
  e2e:dev:
    context: host
    description: Start the dedicated e2e dev stack through the repo's mise task surface
    category: dev
    launch:
      kind: command
      exe: mise
      args:
        - run
        - e2e-dev
    depends_on:
      - setup:env:docker
      - setup
      - setup:docker:images
    requirements:
      toolchains:
        - node
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
      network: true
      network_kind: broad
    runtime:
      kind: service
      surfaces:
        e2e-site:
          project:
            host:
              primary: true
        e2e-api: {}
    notes: |
      This covers the repo's dedicated `mise e2e-dev` stack rooted under `e2e/docker-compose.dev.yml`.
      Ota models it as a long-running service launch through `mise run e2e-dev` so runtime proof
      stays first-class while the repo keeps `mise` as the real contributor front door.
  e2e:dev-down:
    context: host
    description: Tear down the dedicated e2e dev stack through the repo's mise task surface
    category: cleanup
    run: //:e2e-dev-down
    execution:
      default_mode: native
      orchestrator:
        ref: mise
        mode: task
      modes:
        native:
          context: host
    depends_on:
      - setup:env:docker
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
    notes: |
      Use this when a prior e2e stack run left compose state behind or when you want explicit teardown
      outside the `mise e2e-dev` interactive lifecycle.
  server:verify:
    context: host
    description: Run the server CI unit checklist through the repo's mise task surface
    category: test
    run: //server:ci-unit
    execution:
      default_mode: native
      orchestrator:
        ref: mise
        mode: task
      modes:
        native:
          context: host
        container:
          context: app
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      This mirrors the upstream `Test` workflow's server lane.
      It covers install, plugin build, formatting, lint, typecheck, and unit tests for `server/`.
  web:verify:
    context: host
    description: Run the web CI unit checklist through the repo's mise task surface
    category: test
    run: //web:ci-unit
    execution:
      default_mode: native
      orchestrator:
        ref: mise
        mode: task
      modes:
        native:
          context: host
        container:
          context: app
    depends_on:
      - setup
    requirements:
      toolchains:
        - node
    notes: |
      This mirrors the upstream `Test` workflow's web lane.
      It covers SDK prep plus the web unit checklist for `web/`.
  verify:
    description: Aggregate the proven native mise verification slice for server and web
    category: test
    aggregate:
      tasks:
        - server:verify
        - web:verify
    notes: |
      Contract-level verification path for the selected native or isolated-container checklist slice.
      It intentionally stays narrower than the full local dev stack so contributors and agents can
      choose between checklist proof and the real app front door.
workflows:
  default: app
  app:
    intent: local_development
    description: Canonical docker-backed Immich development workflow through the repo's mise task surface
    prepare:
      task: setup:env:docker
    setup:
      task: setup:app
    run:
      task: dev
    readiness:
      surfaces:
        - site
        - api
        - machine-learning
    exposes:
      - surface: site
      - surface: api
      - surface: machine-learning
    notes: |
      Use `ota up --workflow app` or `ota proof runtime --workflow app` when you want the real
      contributor path: env materialization, mise trust/install, and the docker-backed local stack
      started through `mise dev`.
  e2e:
    intent: local_development
    description: Dedicated docker-backed e2e development workflow through the repo's mise task surface
    prepare:
      task: setup:env:docker
    setup:
      task: setup:e2e
    run:
      task: e2e:dev
    readiness:
      surfaces:
        - e2e-site
        - e2e-api
    exposes:
      - surface: e2e-site
      - surface: e2e-api
    notes: |
      Use `ota up --workflow e2e` or `ota proof runtime --workflow e2e` when you want the repo's
      dedicated browser-level test stack through `mise e2e-dev` instead of the default local dev path.
  verify:
    description: Canonical native or container verification path for the selected server and web checklist slice
    setup:
      task: setup
    run:
      task: verify
    notes: |
      Use `ota up --workflow verify` for the native contributor path, or `ota up --workflow verify --container`
      when you want the same mise-driven checklist slice without relying on host Node parity.
agent:
  posture: readiness_strict
  entrypoint: setup
  default_task: verify
  verify_after_changes:
    - verify
  writable_paths:
    - server
    - web
    - packages
    - docs
    - i18n
    - docker
  protected_paths:
    - .github/workflows
    - mise.toml
    - pnpm-lock.yaml
    - ota.yaml
  notes: |
    Use `ota doctor` first to inspect host readiness for either the full local dev stack or the
    narrower verification slice.
    Use `ota up --workflow app` for the repo's canonical docker-backed contributor path through
    `mise dev`.
    Use `ota proof runtime --workflow app` when you want clean-machine proof that the local stack
    really becomes ready.
    Use `ota proof runtime --workflow e2e` when you want the dedicated e2e dev stack proved as a
    first-class Ota workflow instead of treating it as repo-local tribal knowledge.
    Use `ota up --workflow verify` for the narrower server and web verification path.
    Use `ota up --workflow verify --container` when you want the same checklist slice through an isolated container lane.
    This pressure branch depends on Ota `1.6.20` contract surfaces, so keep the matrix pinned to
    released `1.6.20` or newer instead of falling back to source-install proof.
    Use `ota tasks --use` last to inspect the rest of the declared task surface.
